name: Send Daily Newsletter

on:
  schedule:
    # Runs at every ODD hour in Dhaka time, at minute 10 = 12 times per day.
    # Minute 10 (not :00) is used because GitHub is busiest at the top of the hour, so runs there are delayed or dropped more often.
    # Dhaka is UTC+6, so odd Dhaka hours are odd UTC hours: 1, 3, 5 ... 23.
    # UTC times:   01:10, 03:10, 05:10, 07:10, 09:10, 11:10, 13:10, 15:10, 17:10, 19:10, 21:10, 23:10
    # Dhaka times: 7:10 AM, 9:10 AM, 11:10 AM, 1:10 PM, 3:10 PM, 5:10 PM, 7:10 PM, 9:10 PM, 11:10 PM, 1:10 AM, 3:10 AM, 5:10 AM
    # The script creates only ONE broadcast per UTC day: the first run that works does it (email goes out ~2 minutes after that run starts),
    # the other 11 runs print "Nothing to do" and exit.
    - cron: '10 1-23/2 * * *'   # minute 10, every odd UTC hour (1 to 23)

  workflow_dispatch: # Manual trigger for testing
    inputs:
      force:
        description: 'Ignore the one-broadcast-per-day protection (tick this only if today already has a broadcast)'
        type: boolean
        default: false
      draft_only:
        description: 'Only create a DRAFT in Kit, do not send (UNTICK this to really send the email)'
        type: boolean
        default: true

# Never let two newsletter runs overlap (a second run waits for the first to finish, so the duplicate check always sees the first run's result)
concurrency:
  group: send-newsletter
  cancel-in-progress: false

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create Kit broadcast
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}   # reads the latest bulletin and the send log
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}   # creates the broadcast in Kit
          FORCE_SEND: ${{ inputs.force }}           # empty on scheduled runs
          DRAFT_ONLY: ${{ inputs.draft_only }}      # empty on scheduled runs, so the real send happens
        run: node .github/scripts/send-newsletter.mjs